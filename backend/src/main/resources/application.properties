spring.application.name=caluno-back

# Porta: local 8080 / Render utiliza a variável PORT
server.port=${PORT:8080}

# URL de conexão do banco de dados
#spring.datasource.url=jdbc:postgresql://${LOCALHOST}/caluno
spring.datasource.url=jdbc:postgresql://${PGSQL_HOST_SUPA_CALUNO}:${PGSQL_PORT}/${PGSQL_DATABASE_SU}?sslmode=require&currentSchema=caluno
# Usuário
spring.datasource.username=${PGSQL_USERNAME_SUPA_CALUNO}
# Senha
spring.datasource.password=${PGSQL_PASSWORD_SUPA_CALUNO}
# Driver do PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver


# Configurações do Hibernate / JPA
# O dialeto ajuda o Hibernate a falar a "língua" específica do Postgres
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# ddl-auto=validate fará o Flyway trabalhar sem editar automaticamente
# ou altera se você adicionar novas colunas (mas não deleta dados existentes).
spring.jpa.hibernate.ddl-auto=validate

# Mostra o SQL gerado pelo Spring no console (ótimo para testar)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.schemas=caluno
spring.flyway.default-schema=caluno

# API USDA
usda.api.url=https://api.nal.usda.gov/fdc/v1
usda.api.key=${USDA_API_KEY:}

# API de traducao
traducao.email=${EMAIL_SKA:}

