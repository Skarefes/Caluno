
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Criar conta | Caluno</title>

    <!-- CSS que já existe no projeto -->
    <link rel="stylesheet" href="css/style.css">

    <!-- CSS específico de login e cadastro -->
    <link rel="stylesheet" href="css/autenticacao.css">

    <!-- JavaScript do cadastro -->
    <script src="js/cadastro.js" defer></script>
</head>

<body class="auth-page">

    <main class="auth-container">

        <a href="index.html" class="logo">
            <span class="logo-icon">✦</span>
            <span>Caluno<span class="logo-dot">.</span></span>
        </a>

        <section class="auth-card">

            <p class="auth-label">COMECE SUA JORNADA</p>

            <h1>Crie sua conta</h1>

            <p class="auth-description">
                Organize sua alimentação e acompanhe sua evolução.
            </p>

            <form id="cadastro-form">

                <div class="auth-field">
                    <label for="nome">Nome de usuário</label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Digite seu nome"
                        required
                        autocomplete="username"
                    >
                </div>

                <div class="auth-field">
                    <label for="senha">Senha</label>

                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Mínimo de 6 caracteres"
                        minlength="6"
                        required
                        autocomplete="new-password"
                    >
                </div>

                <div class="auth-field">
                    <label for="confirmar-senha">Confirmar senha</label>

                    <input
                        type="password"
                        id="confirmar-senha"
                        name="confirmar-senha"
                        placeholder="Digite a senha novamente"
                        minlength="6"
                        required
                        autocomplete="new-password"
                    >
                </div>

                <p id="cadastro-mensagem" class="auth-message"
                   aria-live="polite"></p>

                <button type="submit" class="button-primary" id="cadastro-botao">
                    Criar minha conta
                </button>

            </form>

            <p class="auth-footer">
                Já possui uma conta?
                <a href="login.html">Entrar</a>
            </p>

        </section>

        <p class="auth-legal">
            Ao criar sua conta, você poderá registrar e acompanhar
            suas informações alimentares.
        </p>

    </main>

</body>
</html>
